{% extends "base.html" %}
{% block title %}Edit Question{% endblock %}
{% block content %}
<div class="mb-6">
  <a href="{% url 'exams:question_review' offering.pk %}" class="text-sm text-emerald-700 font-semibold hover:underline">← Question bank</a>
  <h1 class="text-2xl font-extrabold text-slate-800 mt-1">Edit question</h1>
</div>

<div class="max-w-2xl bg-white rounded-xl border border-slate-200 shadow-sm p-6">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-semibold text-slate-600 mb-1">Type</label>
      <select name="type" id="type" class="px-3 py-2 rounded-lg border border-slate-300 text-sm">
        <option value="mcq" {% if question.is_mcq %}selected{% endif %}>MCQ</option>
        <option value="cq" {% if not question.is_mcq %}selected{% endif %}>CQ</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-600 mb-1">Question text</label>
      <textarea name="text" rows="3" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm">{{ question.text }}</textarea>
    </div>

    <div id="options-block" {% if not question.is_mcq %}class="hidden"{% endif %}>
      <label class="block text-sm font-semibold text-slate-600 mb-1">Options (one per line)</label>
      <textarea name="options" rows="4" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm">{% for o in question.options %}{{ o }}
{% endfor %}</textarea>
      <label class="block text-sm font-semibold text-slate-600 mb-1 mt-3">Correct option index (0-based)</label>
      <input type="number" name="correct_index" value="{{ question.correct_answer|default:0 }}" min="0" class="w-24 px-3 py-2 rounded-lg border border-slate-300 text-sm">
    </div>

    <div id="reference-block" {% if question.is_mcq %}class="hidden"{% endif %}>
      <label class="block text-sm font-semibold text-slate-600 mb-1">Reference answer</label>
      <textarea name="reference_answer" rows="3" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm">{{ question.correct_answer|default:"" }}</textarea>
    </div>

    <button class="px-5 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold">Save changes</button>
  </form>
</div>

<script>
  const t = document.getElementById('type');
  const ob = document.getElementById('options-block');
  const rb = document.getElementById('reference-block');
  function toggle() {
    const mcq = t.value === 'mcq';
    ob.classList.toggle('hidden', !mcq);
    rb.classList.toggle('hidden', mcq);
  }
  t.addEventListener('change', toggle);
</script>
{% endblock %}
