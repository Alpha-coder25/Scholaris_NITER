{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Scholaris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <style>body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-700 via-indigo-700 to-sky-700 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-6 text-white">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/20 text-3xl mb-3 shadow-lg">🎓</div>
      <h1 class="text-2xl font-extrabold tracking-tight">Create a student account</h1>
      <p class="mt-1 text-white/75 text-sm">Join Scholaris — enroll in courses and take exams</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-7">
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 px-4 py-2.5 rounded-lg text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-sky-50 text-sky-800 border border-sky-200{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" class="space-y-3.5">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_first">First name</label>
            <input type="text" name="first_name" id="id_first" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_last">Last name</label>
            <input type="text" name="last_name" id="id_last" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_username">Username *</label>
          <input type="text" name="username" id="id_username" required autofocus placeholder="e.g. s.karim"
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_email">Email</label>
          <input type="email" name="email" id="id_email" placeholder="you@niter.edu.bd"
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_dept">Department *</label>
            <select name="department" id="id_dept" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
              {% for d in departments %}
              <option value="{{ d.pk }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_stu">Student ID</label>
            <input type="text" name="student_id_no" id="id_stu" placeholder="e.g. 2023-CSE-010"
                   class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1" for="id_password">Password *</label>
          <input type="password" name="password" id="id_password" required placeholder="At least 6 characters"
                 class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-violet-700 hover:bg-violet-800 text-white font-bold">
          Create account
        </button>
      </form>

      <p class="mt-5 text-center text-sm text-slate-500">
        Already have an account?
        <a href="{% url 'accounts:login' %}" class="font-semibold text-violet-700 hover:underline">Log in</a>
      </p>
      <p class="mt-2 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-slate-600">← Back to home</a>
      </p>
    </div>
  </div>
</body>
</html>
